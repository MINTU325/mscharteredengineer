    <!-- 3. FAQ Schema (Helps win Google Rich Results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",

        {
          "@type": "Question",
          "name": "What is a Chartered Engineer Certificate and who needs it?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A Chartered Engineer Certificate is an official statutory document issued by a Chartered Engineer certified by the Institution of Engineers (India). It is required for DGFT (EPCG, SION, Advanced Authorization), CBIC/Customs (EOU Investment), MSME Grants, MoFPI subsidies, and other Government compliance purposes."
          }
        },
        {
          "@type": "Question",
          "name": "How is Plant and Machinery Valuation done for Bank loan or mortgage?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Plant & Machinery Valuation for bank loans or mortgage security is conducted by a Registered Valuer using Fair Market Value or Forced Liquidation Value methods as per IBBI Valuation Standards, IndAS 16, and applicable banking guidelines. MS Chartered Engineers provides bank-accepted valuation reports."
          }
        },
        {
          "@type": "Question",
          "name": "What is CEIG Solar Drawing Approval and why is it required?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CEIG (Chief Electrical Inspector to Government) Solar Drawing Approval is a mandatory statutory clearance required for solar power projects and grid-connected systems. It involves approval of Single Line Diagrams (SLD), layout drawings and protection relay settings by a certified Chartered Engineer before installation."
          }
        },
        {
          "@type": "Question",
          "name": "What FSSAI services do MS Chartered Engineers offer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "MS Chartered Engineers provides FSSAI License Registration (new), FSSAI License Renewal, Compliance Audits, Hygiene Ratings, and Food Safety Management System (FSMS) advisory services for food manufacturers, processors, and distributors across India."
          }
        },
        {
          "@type": "Question",
          "name": "Can MS Chartered Engineers serve clients outside Jaipur?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, MS Chartered Engineers has a Pan-India practice. While headquartered in Jaipur, Rajasthan, we serve clients across all major cities and states in India for valuation, chartered engineer certification, FSSAI compliance, and CEIG solar approvals."
          }
        },
        {
          "@type": "Question",
          "name": "What is Componentization of assets under IndAS 16?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Componentization under IndAS 16 (Indian Accounting Standard 16 – Property, Plant and Equipment) requires identifying and accounting for significant components of an asset separately. MS Chartered Engineers provides expert componentization reports for financial reporting, balance sheet preparation and statutory audit compliance."
          }
        }
      ]
    }
    </script>
