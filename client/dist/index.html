      <main>
        <article>
          <h1>Chartered Engineer in Jaipur &amp; India | Government Approved Valuers — MS Chartered Engineers</h1>
          <p>
            MS Chartered Engineers (IIT Roorkee) is an authorized Chartered Engineering and Government Registered Valuation firm headquartered in Jaipur, Rajasthan (PIN: 302019), delivering bankable valuation and certification solutions across India. Led by Er. Mukesh Singh (B.Tech Mechanical Engineering, IIT Roorkee and Corporate Member of The Institution of Engineers India — CEng MIE).
          </p>

          <section>
            <h2>Property &amp; Land Valuation in Jaipur &amp; Rajasthan</h2>
            <p>
              Authoritative real estate and immovable property appraisals adhering strictly to IBBI Valuation Standards, CPWD Plinth Area Rates, and State DLC / Circle Rates:
            </p>
            <ul>
              <li><strong>Residential Real Estate:</strong> Valuation of independent villas, luxury bungalows, builder floors, and residential apartments across prime Jaipur localities (Mansarovar, Vaishali Nagar, Jagatpura, Malviya Nagar, C-Scheme, Tonk Road, Ajmer Road).</li>
              <li><strong>Commercial &amp; Plotted Developments:</strong> Market appraisal of commercial office spaces, retail malls, high-street shops, and sub-divided land parcels.</li>
              <li><strong>Industrial Land &amp; Warehouses:</strong> Comprehensive asset appraisal for industrial premises in RIICO Industrial Areas (Sitapura, Vishwakarma VKIA, Mansarovar, Bindayaka, Boranada, Neemrana).</li>
              <li><strong>Agricultural &amp; Farmhouse Land:</strong> Land conversion status verification, DLC benchmark validation, and rural land valuation.</li>
            </ul>
          </section>

          <section>
            <h2>Bank Loan, Mortgage &amp; Collateral Valuation (FMV &amp; FSV)</h2>
            <p>
              Bankable appraisal reports accepted by Public Sector Banks, Private Commercial Banks, NBFCs, and Housing Finance Companies nationwide:
            </p>
            <ul>
              <li><strong>Fair Market Value (FMV) &amp; Realizable Value (RV):</strong> Dual methodology assessment for retail home loans, LAP (Loan Against Property), and commercial loans.</li>
              <li><strong>Forced Sale Value (FSV) &amp; SARFAESI Reserves:</strong> Distress value calculations for NPA recovery, loan recovery proceedings, and consortium project finance.</li>
              <li><strong>Stage-wise Construction Verification:</strong> Physical milestone monitoring and fund disbursement certification for real estate developers and home buyers.</li>
            </ul>
          </section>

          <section>
            <h2>Statutory &amp; Capital Gains Tax Valuation (Section 50C &amp; 2001 FMV)</h2>
            <p>
              Registered Valuer reports for statutory compliance under the Income Tax Act 1961:
            </p>
            <ul>
              <li><strong>Fair Market Value as on 01-04-2001:</strong> Baseline valuation for ancestral and inherited properties to maximize indexation benefits under Section 55(2)(b).</li>
              <li><strong>Section 50C, 43CA &amp; 56(2)(x) Defense:</strong> Technical valuation defense reports for property sale consideration disputed against Sub-Registrar stamp duty circle rates.</li>
              <li><strong>Tax Scrutiny &amp; ITAT Appeals:</strong> Expert valuation evidence for CIT (Appeals), Income Tax Appellate Tribunal (ITAT), and high-value assessment scrutiny.</li>
            </ul>
          </section>

          <section>
            <h2>Statutory Chartered Engineer Certification &amp; DGFT Authorisations</h2>
            <p>
              Government-authorized Chartered Engineer certification by Corporate Member MIE of The Institution of Engineers (India):
            </p>
            <ul>
              <li><strong>DGFT Advance Authorisation (Appendix 4E / 4K):</strong> Input-to-output consumption norms and technical nexus certification for duty-free raw material imports.</li>
              <li><strong>EPCG Scheme Nexus Verification:</strong> Capital goods utilization certificates for concessional customs duty import obligations.</li>
              <li><strong>Customs Second-Hand Machinery Valuation:</strong> Appraising residual useful life, condition, and fair customs tariff value for used capital goods import clearance.</li>
              <li><strong>EOU / SEZ &amp; SION Fixation:</strong> Certification under CBIC regulations and Ministry of Commerce guidelines.</li>
            </ul>
          </section>

          <section>
            <h2>Plant &amp; Machinery Asset Valuation (IndAS 16 &amp; DRC)</h2>
            <p>
              Technical and financial appraisal of plant, machinery, heavy equipment, and production lines:
            </p>
            <ul>
              <li><strong>Depreciated Replacement Cost (DRC) Valuation:</strong> Replacement cost assessment factoring physical wear, technological obsolescence, and salvage value.</li>
              <li><strong>IndAS 16 Asset Componentization:</strong> Component-wise asset splitting, residual useful life estimation, and Schedule II depreciation schedules.</li>
              <li><strong>IBC 2016 &amp; NCLT Appraisals:</strong> Determination of Fair Value and Liquidation Value for Resolution Professionals (RPs) and Committee of Creditors (CoC).</li>
            </ul>
          </section>

          <section>
            <h2>AutoCAD 2D Electrical Drafting Services</h2>
            <p>
              Professional AutoCAD 2D drafting, preparation, and modification services for electrical consultants, MEP contractors, panel builders, industrial plants, and infrastructure projects:
            </p>
            <ul>
              <li><strong>Electrical Layout Drawings:</strong> Comprehensive floor plans, industrial machine layouts, substation layouts, and power distribution plans.</li>
              <li><strong>Single Line Diagrams (SLD):</strong> HT/LT power distribution SLD, solar captive plant SLD, switchyard schematics, and Discom/CEIG approval drawings.</li>
              <li><strong>LT/HT Panel Drawings:</strong> PCC, MCC, APFC, VFD, synchronizing panel general arrangements (GA), single line schematics, and terminal wiring diagrams.</li>
              <li><strong>Cable Routing &amp; Cable Schedule:</strong> Cable tray routing plans, trench sections, conduit layouts, drum schedules, and termination schedules.</li>
              <li><strong>Lighting &amp; Power Layout:</strong> Fixture placement, lux distribution, conduit wiring, emergency circuits, and small power socket distribution layouts.</li>
              <li><strong>Electrical Equipment Layout:</strong> Transformer yard, DG set, UPS/battery room, and indoor switchgear equipment layouts.</li>
              <li><strong>PDF/JPG to AutoCAD (DWG) Conversion:</strong> Precision redrawing of paper blueprints, PDF scans, and hand sketches into fully editable layered DWG/DXF files.</li>
              <li><strong>Existing Drawing Modification &amp; As-Built Drawings:</strong> Redline revision management, site deviation updates, and final as-built drawing sets.</li>
              <li><strong>BOQ-Related Drawing Support:</strong> Bill of quantities cross-referencing, equipment counts, cable length take-offs, and tender drawing packages.</li>
            </ul>
          </section>

          <section>
            <h2>Transparent 8-Step Auditable Valuation Process</h2>
            <ol>
              <li><strong>Submit Valuation Purpose:</strong> Initial discovery via Website, Phone (+91 91586 58885), or WhatsApp.</li>
              <li><strong>Document Checklist &amp; Scrutiny:</strong> Tailored document verification (Title deed, sanctioned map, purchase invoice, BOM).</li>
              <li><strong>Upfront Transparent Quote:</strong> Fixed, transparent quotation with statutory acceptance commitment.</li>
              <li><strong>Physical Site &amp; Technical Inspection:</strong> Field engineering visit with precise measurements and geo-tagged photographs.</li>
              <li><strong>Regulatory &amp; Market Research:</strong> DLC / Circle rate cross-verification and local transaction analysis.</li>
              <li><strong>Statutory Computation &amp; Draft Review:</strong> Methodological valuation using DRC, Sales Comparison, and Income approaches.</li>
              <li><strong>Quality Audit &amp; Peer Verification:</strong> Multi-tier internal review for statutory robustness.</li>
              <li><strong>Final Stamped Report &amp; Pan-India Dispatch:</strong> Stamped digital PDF + physical hard copy dispatch in 24–48 hours.</li>
            </ol>
          </section>

          <section>
            <h2>Headquarters &amp; Pan-India Contact Information</h2>
            <address>
              <strong>MS Chartered Engineers (IIT Roorkee)</strong><br />
              Jaipur Central Headquarters: Jaipur, Rajasthan - 302019, India<br />
              Direct Phone: <a href="tel:+919158658885">+91 91586 58885</a><br />
              Statutory Email: <a href="mailto:ms.charteredengineer@gmail.com">ms.charteredengineer@gmail.com</a><br />
              Pan-India practice covering Jaipur, Delhi-NCR, Mumbai, Ahmedabad, Bengaluru, Chennai, Kolkata, and all Indian industrial corridors.
            </address>
          </section>
