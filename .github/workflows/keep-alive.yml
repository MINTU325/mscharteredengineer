name: Render Keep Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render from going to sleep (free tier spins down after 15m)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MS Chartered Engineers Live Website
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://www.mscharteredengineer.com/api/health
          echo "Keep-alive ping sent to Render server successfully."
